tools:
- name: GetBusinessDetails
  description: Business and site details (timezone, display name, business name, installed app capabilities).
  parameters: []
  mutating: false
- name: SearchInSite
  description: Full-text search across the site's public content.
  parameters:
  - searchTerm
  mutating: false
- name: SearchSiteApiDocs
  description: Returns the Wix API documentation for the business solutions installed on this site.
  parameters:
  - searchTerm
  mutating: false
- name: GenerateVisitorToken
  description: Creates a visitor session and returns a visitor access token; prerequisite for CallWixSiteAPI.
  parameters: []
  mutating: false
- name: CallWixSiteAPI
  description: Calls a Wix REST API method on the site on a visitor's behalf.
  parameters:
  - visitorToken
  - url
  - method
  - body
  mutating: true
- name: ExecuteWixAPI
  description: Runs JavaScript against the Wix REST API on the site; carries an explicit hasMutations
    flag.
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  mutating: true
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
  parameters:
  - menuUrl
  - reason
  mutating: false
- name: ReadFullDocsArticle
  description: Fetch a full article from the Wix developer documentation portal.
  parameters:
  - articleUrl
  mutating: false
- name: ReadFullDocsMethodSchema
  description: Fetch the full request/response schema for a Wix API method.
  parameters:
  - articleUrl
  - reason
  mutating: false
