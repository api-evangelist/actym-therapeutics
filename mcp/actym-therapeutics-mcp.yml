summary: 'Actym Therapeutics serves a live, anonymous Model Context Protocol endpoint on its own domain
  at https://www.actymthera.com/_api/mcp. The server is PLATFORM-AUTHORED: it is the Wix Site MCP runtime
  that Wix exposes for every site it hosts, advertised by the site''s own llms.txt. Actym publishes it
  from its own host and it is genuinely reachable by an agent today, but the tool surface is Wix''s generic
  site-visitor assistant, not an Actym-authored API. No Actym-specific business tools are exposed; the
  site''s only installed Wix business app is the Blog app.'
