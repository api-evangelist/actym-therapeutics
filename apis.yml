aid: actym-therapeutics
name: Actym Therapeutics
description: 'Actym Therapeutics is a clinical-stage biotechnology company developing bacterial immunotherapies for solid tumors and fibrotic disease. Its STACT platform
  engineers an attenuated Salmonella typhimurium vehicle to be administered systemically and to
  deliver multiple therapeutic payloads that are amplified and produced locally at the disease
  site, with the goal of raising efficacy while limiting systemic toxicity. Its lead asset,
  ACTM-838, is in a Phase 1a/1b trial in patients with advanced solid tumors. Actym publishes no
  developer program, no API and no machine-readable contract; the only agent-facing surfaces on
  its own domain are a platform-generated llms.txt and an anonymous Wix Site MCP endpoint.'
